name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: node test/syntax-check.js

      - name: Test
        env:
          CONTEXT_COMPRESSOR_PORT: 0
        run: npm test

      - name: Benchmark smoke test
        run: npm run benchmark -- 16000

      - name: Context quality benchmark
        run: npm run benchmark:quality -- 12000


  live-agent-discovery:
    name: OpenCode live model discovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCode
        run: npm install --global opencode-ai@latest

      - name: Discover free models and headless syntax
        shell: bash
        run: |
          mkdir -p eval-artifacts
          {
            echo "## VERSION"
            opencode --version || true
            echo "## RUN HELP"
            opencode run --help || true
            echo "## MODELS"
            opencode models || true
          } 2>&1 | tee eval-artifacts/opencode-discovery.txt
          grep -i -E 'muse|spark|1[.]3' eval-artifacts/opencode-discovery.txt | tee eval-artifacts/muse-models.txt || true

      - name: Upload discovery trace
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-live-model-discovery
          path: eval-artifacts/
          retention-days: 7
